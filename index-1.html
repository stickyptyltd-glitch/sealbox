<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sealbox — paired, anonymous, sealed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qr-scanner/1.4.2/qr-scanner.umd.min.js"></script>
<style>
  :root{
    --bg: #F3ECDD;
    --surface: #FBF6EA;
    --surface-2: #F0E6D2;
    --text: #241A2E;
    --text-muted: #6E6076;
    --accent: #B34A2A;
    --accent-ink: #FBF6EA;
    --accent-2: #6C55C2;
    --border: rgba(36,26,46,0.14);
    --danger: #A83232;
    --ok: #4C7A4C;
    --shadow: 0 1px 0 rgba(36,26,46,0.05);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg: #16121F; --surface: #221B31; --surface-2: #2A2140;
      --text: #F4EFFB; --text-muted: #A79BC0; --accent: #DD724A;
      --accent-ink: #1B1424; --accent-2: #A292F2; --border: rgba(244,239,251,0.14);
      --danger: #E28080; --ok: #7FBE7F;
    }
  }
  :root[data-theme="dark"]{
    --bg: #16121F; --surface: #221B31; --surface-2: #2A2140;
    --text: #F4EFFB; --text-muted: #A79BC0; --accent: #DD724A;
    --accent-ink: #1B1424; --accent-2: #A292F2; --border: rgba(244,239,251,0.14);
    --danger: #E28080; --ok: #7FBE7F;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--text); font-family:'Inter', system-ui, -apple-system, sans-serif; min-height:100vh; -webkit-font-smoothing:antialiased; accent-color:var(--accent); }
  .wrap{ max-width:460px; margin:0 auto; padding:26px 18px 40px; min-height:100vh; display:flex; flex-direction:column; }
  h1,h2,h3{ font-family:'Newsreader', Georgia, serif; font-weight:600; letter-spacing:-0.01em; margin:0; }
  a{ color:inherit; }
  .mono{ font-family:'IBM Plex Mono', 'SFMono-Regular', monospace; }

  .seal{ width:48px; height:48px; flex-shrink:0; }
  .seal-hero{ width:72px; height:72px; margin:0 auto 20px; }
  .seal-pulse{ animation: pulse 2.1s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ transform:scale(1); opacity:1; } 50%{ transform:scale(1.08); opacity:.75; } }
  .seal-drop{ animation: seal-drop 650ms cubic-bezier(.2,.9,.25,1.15) both; }
  @keyframes seal-drop{ 0%{ transform:scale(1.8) rotate(-12deg); opacity:0; } 60%{ opacity:1; } 100%{ transform:scale(1) rotate(0); opacity:1; } }
  @media (prefers-reduced-motion: reduce){ .seal-hero, .seal-pulse{ animation:none; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:10px; }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-name{ font-family:'Newsreader', serif; font-size:18px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon-btn{ background:none; border:1px solid var(--border); border-radius:9px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-muted); flex-shrink:0; font-size:15px; }
  .icon-btn:hover{ color:var(--danger); border-color:var(--danger); }
  .link-btn{ background:none; border:none; color:var(--text-muted); font-family:'Inter', sans-serif; font-size:13px; cursor:pointer; padding:6px 0; flex-shrink:0; }
  .link-btn:hover{ color:var(--text); }

  .hero{ text-align:center; padding:14px 0 8px; }
  .hero h1,.hero h2{ font-size:28px; line-height:1.18; margin-bottom:12px; }
  .hero p{ color:var(--text-muted); font-size:14.5px; line-height:1.55; max-width:340px; margin:0 auto 28px; }

  button.primary{ width:100%; background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:14px 18px; font-family:'Inter', sans-serif; font-size:15px; font-weight:600; cursor:pointer; transition:transform .12s ease, opacity .12s ease; }
  button.primary:active{ transform:scale(0.985); }
  button.primary:disabled{ opacity:.45; cursor:default; }
  button.secondary{ width:100%; background:transparent; color:var(--text); border:1px solid var(--border); border-radius:10px; padding:13px 18px; font-family:'Inter', sans-serif; font-size:14.5px; font-weight:500; cursor:pointer; }
  button.danger-solid{ width:100%; background:var(--danger); color:var(--accent-ink); border:none; border-radius:10px; padding:13px 18px; font-family:'Inter', sans-serif; font-size:14.5px; font-weight:600; cursor:pointer; }
  .quiet-note{ text-align:center; font-size:12px; color:var(--text-muted); line-height:1.6; margin-top:20px; }
  .text-input{ width:100%; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:13px 14px; font-size:15px; color:var(--text); outline:none; font-family:'Inter', sans-serif; }
  .text-input:focus{ border-color:var(--accent-2); }

  .anon-badge{ display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); border-radius:20px; padding:6px 13px; font-size:11.5px; color:var(--text-muted); font-family:'Inter', sans-serif; letter-spacing:0.01em; }
  .anon-badge-wrap{ text-align:center; margin-bottom:22px; }

  .pair-card{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border); border-radius:13px; padding:14px; margin-bottom:10px; cursor:pointer; text-align:left; }
  .pair-card .meta{ flex:1; min-width:0; }
  .pair-card .label{ font-size:14.5px; font-weight:500; }
  .pair-card .status{ font-size:12px; color:var(--text-muted); margin-top:3px; display:flex; align-items:center; gap:6px; }
  .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .dot.paired{ background:var(--ok); }
  .dot.waiting{ background:var(--accent); }
  .section-label{ font-size:12.5px; color:var(--text-muted); margin:0 0 12px 2px; }
  .new-pair-fab{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:10px; padding:13px 18px; font-size:14.5px; font-weight:600; cursor:pointer; width:100%; margin-top:6px; }

  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; }
  .share-card{ margin-bottom:18px; }
  .share-card .label{ font-size:12px; color:var(--text-muted); margin-bottom:9px; }
  .share-row{ display:flex; align-items:center; gap:8px; background:var(--surface-2); border-radius:9px; padding:11px 12px; }
  .share-row .url{ flex:1; font-family:'IBM Plex Mono', monospace; font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .copy-btn{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:7px; padding:8px 12px; font-size:12.5px; font-weight:600; cursor:pointer; flex-shrink:0; }
  .waiting-state{ text-align:center; padding:20px 4px 4px; }
  .waiting-state h2{ font-size:19px; margin-bottom:8px; }
  .waiting-state p{ color:var(--text-muted); font-size:13.5px; line-height:1.55; max-width:300px; margin:0 auto 22px; }

  .status-row{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); margin-bottom:14px; }
  .thread{ flex:1; overflow-y:auto; padding:4px 2px 10px; display:flex; flex-direction:column; gap:10px; min-height:120px; max-height:50vh; }
  .bubble-row{ display:flex; }
  .bubble-row.me{ justify-content:flex-end; }
  .bubble-row.them{ justify-content:flex-start; }
  .bubble{ max-width:78%; padding:10px 13px; border-radius:14px; font-size:14.5px; line-height:1.48; white-space:pre-wrap; word-break:break-word; }
  .bubble-row.me .bubble{ background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:4px; }
  .bubble-row.them .bubble{ background:var(--surface); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .bubble.pending{ opacity:.55; font-style:italic; }
  .bubble.bubble-image{ padding:5px; }
  .bubble.bubble-audio{ padding:10px 12px; min-width:190px; }
  .bubble-time{ font-size:10.5px; color:var(--text-muted); margin-top:4px; font-family:'IBM Plex Mono', monospace; }
  .bubble-row.me .bubble-time{ text-align:right; }

  .msg-img{ display:block; max-width:100%; max-height:240px; border-radius:10px; cursor:zoom-in; }
  .audio-row{ display:flex; align-items:center; gap:10px; }
  .audio-row audio{ height:32px; max-width:150px; }
  .audio-row .dur{ font-family:'IBM Plex Mono', monospace; font-size:11.5px; opacity:.85; flex-shrink:0; }
  .transcript{ margin-top:8px; font-size:12.5px; font-style:italic; opacity:.85; border-top:1px solid rgba(128,128,128,.25); padding-top:7px; line-height:1.45; }

  .composer{ display:flex; gap:7px; align-items:flex-end; margin-top:14px; }
  .composer textarea{ flex:1; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:11px 13px; font-size:14.5px; color:var(--text); line-height:1.4; resize:none; outline:none; max-height:110px; font-family:'Inter', sans-serif; }
  .composer textarea:focus{ border-color:var(--accent-2); }
  .round-btn{ background:var(--surface); border:1px solid var(--border); color:var(--text-muted); border-radius:11px; width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:17px; }
  .round-btn:hover{ color:var(--text); }
  .send-btn{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:11px; width:44px; height:44px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px; }
  .send-btn:disabled{ opacity:.4; cursor:default; }
  input[type=file]{ display:none; }

  .recording-row{ display:flex; align-items:center; gap:10px; margin-top:14px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:9px 12px; }
  .rec-dot{ width:9px; height:9px; border-radius:50%; background:var(--danger); animation:recblink 1.1s ease-in-out infinite; flex-shrink:0; }
  @keyframes recblink{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }
  .rec-time{ font-family:'IBM Plex Mono', monospace; font-size:13px; flex:1; }
  .rec-cancel, .rec-stop{ border:none; border-radius:9px; padding:8px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .rec-cancel{ background:transparent; color:var(--text-muted); border:1px solid var(--border); }
  .rec-stop{ background:var(--accent); color:var(--accent-ink); }
  .uploading-row{ display:flex; align-items:center; gap:10px; margin-top:14px; font-size:12.5px; color:var(--text-muted); }

  .empty{ text-align:center; padding:30px 10px; color:var(--text-muted); }
  .empty .seal{ opacity:.5; margin:0 auto 12px; }
  .empty p{ font-size:13.5px; line-height:1.6; max-width:270px; margin:0 auto; }

  .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px); background:var(--text); color:var(--bg); font-size:13px; padding:10px 16px; border-radius:20px; opacity:0; pointer-events:none; transition:opacity .2s ease, transform .2s ease; white-space:nowrap; z-index:10; max-width:88vw; overflow:hidden; text-overflow:ellipsis; }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .skeleton{ background:linear-gradient(90deg, var(--surface-2) 25%, var(--border) 37%, var(--surface-2) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; border-radius:6px; height:14px; }
  @keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

  .confirm-backdrop{ position:fixed; inset:0; background:rgba(20,14,26,0.5); display:flex; align-items:flex-end; justify-content:center; z-index:20; padding:0; }
  .confirm-sheet{ background:var(--surface); border-radius:18px 18px 0 0; padding:22px 20px 26px; width:100%; max-width:460px; }
  .confirm-sheet h3{ font-size:18px; margin-bottom:10px; }
  .confirm-sheet p{ font-size:13.5px; color:var(--text-muted); line-height:1.55; margin-bottom:12px; }
  .confirm-actions{ display:flex; flex-direction:column; gap:9px; }

  .lightbox{ position:fixed; inset:0; background:rgba(10,7,14,0.92); z-index:30; display:flex; align-items:center; justify-content:center; padding:20px; cursor:zoom-out; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:8px; }

  .safety-code{ font-size:16px; letter-spacing:1.5px; background:var(--surface-2); border-radius:9px; padding:11px 13px; margin:8px 0 4px; text-align:center; }

  .sponsor-card{ display:block; background:var(--surface); border:1px dashed var(--border); border-radius:12px; padding:13px 15px; margin-top:22px; text-decoration:none; color:inherit; }
  .sponsor-label{ display:block; font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-muted); margin-bottom:5px; }
  .sponsor-name{ display:block; font-size:14px; font-weight:600; }
  .sponsor-tagline{ display:block; font-size:12.5px; color:var(--text-muted); margin-top:3px; line-height:1.4; }

  /* Covers the screen the instant the tab/app backgrounds, so the OS's
     app-switcher preview shows this instead of whatever was on screen.
     This is the one real, honest thing a web page can do here — it is
     not screenshot or screen-recording prevention, which no browser API
     allows a page to detect or block at all. */
  .privacy-shield{ position:fixed; inset:0; background:var(--bg); z-index:50; display:none; align-items:center; justify-content:center; }
  .privacy-shield .seal{ width:56px; height:56px; opacity:0.5; }
  .qr-box{ background:#fff; border-radius:10px; padding:12px; display:flex; align-items:center; justify-content:center; margin:10px 0; }
  .qr-box img, .qr-box canvas, .qr-box table{ display:block; }
  .ttl-row{ display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; }
  .ttl-opt{ background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:7px 11px; font-size:12.5px; cursor:pointer; color:var(--text-muted); }
  .ttl-opt.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .flame-badge{ font-size:10.5px; opacity:.8; margin-right:4px; }
  .burn-armed{ background:var(--accent) !important; color:var(--accent-ink) !important; border-color:var(--accent) !important; }
  .scan-overlay{ position:fixed; inset:0; background:#000; z-index:40; display:flex; flex-direction:column; }
  .scan-overlay video{ flex:1; width:100%; object-fit:cover; }
  .scan-overlay .scan-bar{ padding:16px; background:var(--surface); display:flex; flex-direction:column; gap:10px; }
  .scan-result{ text-align:center; font-size:13.5px; }
  .expiry-note{ font-size:11.5px; color:var(--text-muted); text-align:center; margin-top:10px; }
</style>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>
<div class="privacy-shield" id="privacyShield"><svg class="seal" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="30" fill="var(--accent)"/><path d="M32 46 L24 30 H29 L32 37 L35 30 H40 L32 46 Z" fill="var(--accent-ink)"/></svg></div>

<script>
/* ============================================================
   CRYPTO CORE
   - Each pairing does one ECDH (P-256) key exchange.
   - The raw ECDH secret is never used directly to encrypt anything.
     It only seeds two one-way HKDF chains (A→B and B→A).
   - Every single message advances its chain one HMAC step and is
     encrypted with a key that exists only for that one message.
     The chain key is overwritten in place after each step, so a
     device compromised later cannot recompute earlier message keys
     — that's what gives this forward secrecy, not just "a shared key".
   ============================================================ */
function bufToB64(buf){ const b=new Uint8Array(buf); let s=''; const CH=0x8000; for(let i=0;i<b.length;i+=CH) s+=String.fromCharCode.apply(null, b.subarray(i, i+CH)); return btoa(s); }
function b64ToBuf(b64){ const bin=atob(b64); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return a.buffer; }

async function generatePairKeys(){
  const pair = await crypto.subtle.generateKey({name:'ECDH', namedCurve:'P-256'}, true, ['deriveBits']);
  const publicKeyJwk = await crypto.subtle.exportKey('jwk', pair.publicKey);
  const privateKeyJwk = await crypto.subtle.exportKey('jwk', pair.privateKey);
  return { publicKeyJwk, privateKeyJwk };
}
async function deriveRootSecret(myPrivateJwk, theirPublicJwk){
  const priv = await crypto.subtle.importKey('jwk', myPrivateJwk, {name:'ECDH', namedCurve:'P-256'}, false, ['deriveBits']);
  const pub = await crypto.subtle.importKey('jwk', theirPublicJwk, {name:'ECDH', namedCurve:'P-256'}, false, []);
  const bits = await crypto.subtle.deriveBits({name:'ECDH', public: pub}, priv, 256);
  return new Uint8Array(bits);
}
async function hkdf(secretBytes, saltStr, infoStr){
  const keyMaterial = await crypto.subtle.importKey('raw', secretBytes, 'HKDF', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits(
    { name:'HKDF', hash:'SHA-256', salt: new TextEncoder().encode(saltStr), info: new TextEncoder().encode(infoStr) },
    keyMaterial, 256
  );
  return new Uint8Array(bits);
}
async function hmacSha256(keyBytes, dataBytes){
  const key = await crypto.subtle.importKey('raw', keyBytes, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  return new Uint8Array(await crypto.subtle.sign('HMAC', key, dataBytes));
}
async function ratchetStep(chainKeyBytes){
  const nextChainKey = await hmacSha256(chainKeyBytes, new Uint8Array([0x01]));
  const messageKeySeed = await hmacSha256(chainKeyBytes, new Uint8Array([0x02]));
  const aesKey = await crypto.subtle.importKey('raw', messageKeySeed, {name:'AES-GCM'}, false, ['encrypt','decrypt']);
  return { nextChainKey, aesKey };
}
async function encryptBytes(aesKey, buf){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, aesKey, buf);
  return { ciphertext: bufToB64(ct), iv: bufToB64(iv) };
}
async function decryptBytes(aesKey, msg){
  return crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBuf(msg.iv)}, aesKey, b64ToBuf(msg.ciphertext));
}
/* ---- fixed-size padding: hides text length (message type is already visible via the
   cleartext `type` field, so padding targets the one signal that isn't already exposed) ---- */
const PAD_BUCKETS = [64,256,1024,4096,16384,65536,98304,131072,163840];
function padPlaintext(bytes){
  const total = 4 + bytes.length;
  const bucket = PAD_BUCKETS.find(b => b >= total) || total;
  const out = new Uint8Array(bucket);
  new DataView(out.buffer).setUint32(0, bytes.length);
  out.set(bytes, 4);
  return out;
}
function unpadPlaintext(buf){
  const u8 = new Uint8Array(buf);
  const len = new DataView(u8.buffer, u8.byteOffset, u8.byteLength).getUint32(0);
  return u8.slice(4, 4 + len);
}
/* ---- envelope: type/mime/duration/transcript all live INSIDE the ciphertext now.
   The message doc on the wire only ever carries seq/burn/ciphertext/iv — a relay
   watching the room can no longer tell a text message from a photo from a voice
   note, or tell that a voice note had a caption, just from the plaintext fields. ---- */
function encodeEnvelope(header, contentBytes){
  const headerBytes = new TextEncoder().encode(JSON.stringify(header));
  const out = new Uint8Array(2 + headerBytes.length + contentBytes.length);
  new DataView(out.buffer).setUint16(0, headerBytes.length);
  out.set(headerBytes, 2);
  out.set(contentBytes, 2 + headerBytes.length);
  return out;
}
function decodeEnvelope(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  const hLen = dv.getUint16(0);
  const header = JSON.parse(new TextDecoder().decode(bytes.slice(2, 2 + hLen)));
  return { header, content: bytes.slice(2 + hLen) };
}
/* ---- post-compromise healing: NOT an automatic in-band DH ratchet.
   An earlier version of this tried to have each side splice a fresh
   Diffie-Hellman secret into its chain on its own timer (every 20
   messages, independently). Tracing through it: both sides share a
   single ratchet identity key across both chain directions, and
   nothing stops both sides from hitting their own trigger before
   they've each seen the other's latest rotation — two people just
   chatting back and forth can do this by accident. When that
   happens the two sides derive DIFFERENT "matching" secrets, and
   every message after that point silently fails to decrypt, with
   no way to detect it until it's already broken. That's a correctness
   bug I can reason my way into, but not reliably reason my way out
   of without a way to actually run the two-sided protocol and watch
   for divergence — so instead of patching it further on paper,
   healing here is a deliberate, unilateral, race-free reset (see
   startFreshKeys below): generate a brand new identity keypair,
   publish the new public half to the room doc, and let both sides
   re-derive their chains from scratch against it. A full replacement
   of the derivation basis can't diverge the way an in-band splice
   can, because there's no shared timing assumption to get wrong. ---- */
function pubKeyId(jwk){ return jwk ? jwk.x + ':' + jwk.y : null; }
async function startFreshKeys(roomId, pair){
  const fresh = await generatePairKeys();
  await updateRoom(roomId, pair.role === 'A' ? { keyA: fresh.publicKeyJwk } : { keyB: fresh.publicKeyJwk });
  upsertPair({ roomId, privateKeyJwk: fresh.privateKeyJwk });
  clearRatchetState(roomId);
}
async function computeSafetyNumber(keyAJwk, keyBJwk){
  const a = keyAJwk.x + ':' + keyAJwk.y, b = keyBJwk.x + ':' + keyBJwk.y;
  const hashBuf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode([a,b].sort().join('|')));
  const bytes = new Uint8Array(hashBuf);
  const groups = [];
  for (let i=0;i<6;i++) groups.push(String((bytes[i*2]<<8 | bytes[i*2+1]) % 100000).padStart(5,'0'));
  return groups.join('  ');
}

/* ---- local passphrase vault (wraps the identity private key at rest) ---- */
async function deriveVaultKey(passphrase, saltBytes){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt:saltBytes, iterations:210000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function pbkdf2VerifierHash(secret, saltBytes){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:saltBytes, iterations:210000, hash:'SHA-256'}, base, 256);
  return bufToB64(bits);
}

/* ---- device-wide app lock + self-destruct ----
   Separate from the per-pairing passphrase vault above: this gates opening
   the app at all, on this device, regardless of how many pairings exist.
   The attempt counter is persisted (not held in a JS variable) specifically
   so reloading the page can't reset it — that's the one thing that would
   make the whole feature pointless. "Wipe" here means: best-effort delete
   every pairing this device is party to from the shared store (so the
   conversation is gone for the other side too, not just hidden from this
   device), then clear every last byte of localStorage, including the lock
   itself. What this can't do: reach into the other party's device, undo
   anything they already have cached locally, or guarantee the underlying
   disk sectors this browser used are securely overwritten — clearing
   localStorage removes it from the browser's view, not necessarily from
   every trace on the physical device. Called out here and in the UI rather
   than left implied, because "fully unrecoverable" is a strong claim and
   the honest version of it has real edges. */
const APP_LOCK_KEY = 'sealbox_app_lock';
const APP_LOCK_ATTEMPTS_KEY = 'sealbox_app_lock_attempts';
function loadAppLock(){ try{ return JSON.parse(localStorage.getItem(APP_LOCK_KEY)); } catch(e){ return null; } }
function saveAppLock(cfg){ localStorage.setItem(APP_LOCK_KEY, JSON.stringify(cfg)); }
function getLockAttempts(){ return parseInt(localStorage.getItem(APP_LOCK_ATTEMPTS_KEY) || '0', 10); }
function setLockAttempts(n){ localStorage.setItem(APP_LOCK_ATTEMPTS_KEY, String(n)); }
async function selfDestructDevice(){
  try{
    const pairs = loadPairs();
    await Promise.all(pairs.map(p => deleteConversation(p.roomId).catch(()=>{})));
  } catch(e){ /* best effort — proceed to local wipe regardless */ }
  try{ localStorage.clear(); } catch(e){}
  app.innerHTML = `
    <div class="hero">
      ${sealSvg('seal seal-hero')}
      <h2>This device is wiped</h2>
      <p>Every pairing and message stored here is gone, and so is the passcode itself — there's nothing saved on this device to unlock or recover. Reload this page to start over from nothing.</p>
    </div>`;
}
const DECOY_MARKER = 'sealbox-decoy-ok-v1';
async function lockPairWithPassphrase(roomId, pairEntry, passphrase, decoyPassphrase){
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const vaultKey = await deriveVaultKey(passphrase, salt);
  const payload = JSON.stringify({ privateKeyJwk: pairEntry.privateKeyJwk });
  const enc = await encryptBytes(vaultKey, new TextEncoder().encode(payload));
  const entry = { roomId, locked:true, saltB64: bufToB64(salt), encPrivateKey: enc.ciphertext, encPrivateKeyIv: enc.iv, privateKeyJwk: null };
  if (decoyPassphrase){
    const dsalt = crypto.getRandomValues(new Uint8Array(16));
    const dkey = await deriveVaultKey(decoyPassphrase, dsalt);
    const denc = await encryptBytes(dkey, new TextEncoder().encode(DECOY_MARKER));
    entry.decoySaltB64 = bufToB64(dsalt);
    entry.decoyCheck = denc.ciphertext;
    entry.decoyCheckIv = denc.iv;
  }
  upsertPair(entry);
}
// Tries the decoy passphrase first (if one is configured), then the real one.
// Both paths fail with the identical error/message, so a wrong guess never reveals
// whether a decoy exists at all.
async function unlockPair(pairEntry, passphrase){
  if (pairEntry.decoySaltB64){
    try{
      const dsalt = new Uint8Array(b64ToBuf(pairEntry.decoySaltB64));
      const dkey = await deriveVaultKey(passphrase, dsalt);
      const plainBuf = await decryptBytes(dkey, { ciphertext: pairEntry.decoyCheck, iv: pairEntry.decoyCheckIv });
      if (new TextDecoder().decode(plainBuf) === DECOY_MARKER){
        return { ...pairEntry, decoy: true };
      }
    } catch(e){ /* not the decoy passphrase — fall through to the real one */ }
  }
  const salt = new Uint8Array(b64ToBuf(pairEntry.saltB64));
  const vaultKey = await deriveVaultKey(passphrase, salt);
  const plainBuf = await decryptBytes(vaultKey, { ciphertext: pairEntry.encPrivateKey, iv: pairEntry.encPrivateKeyIv });
  const parsed = JSON.parse(new TextDecoder().decode(plainBuf));
  return { ...pairEntry, privateKeyJwk: parsed.privateKeyJwk };
}

/* ---- per-message ratchet state (local only — never synced to storage) ---- */
function ratchetStorageKey(roomId){ return 'sealbox_ratchet_'+roomId; }
function loadRatchetState(roomId){ try{ return JSON.parse(localStorage.getItem(ratchetStorageKey(roomId))); } catch(e){ return null; } }
function saveRatchetState(roomId, state){ localStorage.setItem(ratchetStorageKey(roomId), JSON.stringify(state)); }
function clearRatchetState(roomId){ localStorage.removeItem(ratchetStorageKey(roomId)); }
function clearRatchetCache(roomId){
  const state = loadRatchetState(roomId);
  if (state){ state.cache = {}; saveRatchetState(roomId, state); }
}
// Opaque per-pairing sender tags: derived once from the ECDH root, independently
// computable by both sides (HMAC of the root with each role name), so neither
// device has to exchange or announce anything extra. A relay watching the room
// can still tell "same party sent both of these" (the tag is stable for the
// life of the pairing) but can no longer read the literal 'A'/'B' role labels
// off the wire — it's opacity, not unlinkability, and that distinction is worth
// being upfront about rather than overselling it as anonymous-per-message.
async function deriveRoleTag(rootBytes, role){
  const h = await hmacSha256(rootBytes, new TextEncoder().encode('sealbox-role-'+role));
  return bufToB64(h).slice(0,12).replace(/[+/=]/g,'');
}
async function getOrInitRatchet(roomId, pair, room){
  let state = loadRatchetState(roomId);
  if (state) return state;
  const root = await deriveRootSecret(pair.privateKeyJwk, pair.role === 'A' ? room.keyB : room.keyA);
  const chainA2B = await hkdf(root, roomId, 'sealbox-chain-A2B-v1');
  const chainB2A = await hkdf(root, roomId, 'sealbox-chain-B2A-v1');
  const sendChain = pair.role === 'A' ? chainA2B : chainB2A;
  const recvChain = pair.role === 'A' ? chainB2A : chainA2B;
  const myTag = await deriveRoleTag(root, pair.role);
  const peerTag = await deriveRoleTag(root, pair.role === 'A' ? 'B' : 'A');
  state = {
    sendChainKeyB64: bufToB64(sendChain), sendIndex:0,
    recvChainKeyB64: bufToB64(recvChain), recvIndex:0,
    cache:{},
    // Recorded so a later change to the peer's identity key — whether from
    // startFreshKeys or something more concerning — can be noticed instead
    // of silently producing chains that no longer match theirs.
    peerIdentityKeyId: pubKeyId(pair.role === 'A' ? room.keyB : room.keyA),
    myTag, peerTag
  };
  saveRatchetState(roomId, state);
  return state;
}
async function takeSendStep(roomId, state){
  const { nextChainKey, aesKey } = await ratchetStep(new Uint8Array(b64ToBuf(state.sendChainKeyB64)));
  const seq = state.sendIndex;
  state.sendChainKeyB64 = bufToB64(nextChainKey);
  state.sendIndex += 1;
  saveRatchetState(roomId, state);
  return { aesKey, seq };
}
async function decodePeerMessage(aesKey, m){
  const raw = await decryptBytes(aesKey, m);
  const { header, content } = decodeEnvelope(unpadPlaintext(raw));
  if (header.type === 'image') return { type:'image', mime:header.mime||'image/jpeg', dataB64: bufToB64(content) };
  if (header.type === 'audio') return { type:'audio', mime:header.mime||'audio/webm', duration:header.duration, dataB64: bufToB64(content), transcript: header.transcript || null };
  return { type:'text', text: new TextDecoder().decode(content) };
}
async function processIncomingForCache(roomId, pair, state, messages){
  let changed = false;
  // Sort by the sender's chain index, not by (now-coarsened) timestamp — seq is the
  // only value that's guaranteed to reflect true send order, which the ratchet requires.
  const peerMsgs = messages.filter(m => m.from === state.peerTag && !state.cache[m.id]).sort((a,b)=> (a.seq??0)-(b.seq??0));
  for (const m of peerMsgs){
    if (typeof m.seq !== 'number' || m.seq !== state.recvIndex){
      state.cache[m.id] = { type:'error', text:'Could not unseal this message.' };
      changed = true;
      continue;
    }
    const { nextChainKey, aesKey } = await ratchetStep(new Uint8Array(b64ToBuf(state.recvChainKeyB64)));
    try{ state.cache[m.id] = await decodePeerMessage(aesKey, m); }
    catch(e){ state.cache[m.id] = { type:'error', text:'Could not unseal this message.' }; }
    state.recvChainKeyB64 = bufToB64(nextChainKey);
    state.recvIndex += 1;
    changed = true;
    if (m.burn) scheduleBurn(roomId, m.id);
  }
  // Cache is a local optimization keyed by message id — once a message no longer
  // exists in the shared list (deleted, expired, burned), there's nothing to keep.
  const liveIds = new Set(messages.map(m => m.id));
  for (const id of Object.keys(state.cache)){
    if (!liveIds.has(id)){ delete state.cache[id]; changed = true; }
  }
  if (changed) saveRatchetState(roomId, state);
}
function scheduleBurn(roomId, messageId){
  setTimeout(() => { deleteMessage(messageId).catch(()=>{}); }, 4000);
}
function b64ToBlob(b64, mime){ return new Blob([b64ToBuf(b64)], { type: mime }); }

/* ============ storage layer: db capability with local fallback ============ */
let db = null;
let usingSharedStore = false;
async function initStore(){
  try{
    if (window.claude && typeof window.claude.use === 'function'){
      db = await window.claude.use('db');
      usingSharedStore = !!db;
    }
  } catch(e){ db = null; usingSharedStore = false; }
}
const LOCAL_KEY = 'sealbox_shared_store_v2';
function readLocal(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{"rooms":{},"messages":[]}'); } catch(e){ return {rooms:{}, messages:[]}; } }
function writeLocal(s){ localStorage.setItem(LOCAL_KEY, JSON.stringify(s)); }

async function createRoom(){
  const roomId = 'r' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
  const keys = await generatePairKeys();
  const room = { id: roomId, keyA: keys.publicKeyJwk, keyB: null, createdAt: Date.now(), expiresAt: Date.now() + 24*3600*1000, ttlSeconds: null, wipeOnClose: false };
  if (db) await db.doc('rooms/'+roomId).set(room);
  else { const s=readLocal(); s.rooms[roomId]=room; writeLocal(s); }
  return { roomId, privateKeyJwk: keys.privateKeyJwk };
}
async function getRoom(roomId){
  if (db){ const snap = await db.doc('rooms/'+roomId).get(); return snap.exists ? snap.data() : null; }
  const s = readLocal(); return s.rooms[roomId] || null;
}
async function joinRoom(roomId){
  const keys = await generatePairKeys();
  if (db){
    const ref = db.doc('rooms/'+roomId);
    const acq = await ref.acquire({ holder:'join-'+Math.random().toString(36).slice(2), ttlMs:6000 });
    if (!acq.acquired) return { error:'busy' };
    const snap = await ref.get();
    if (!snap.exists) return { error:'not_found' };
    const data = snap.data();
    if (data.keyB) return { error:'full' };
    await ref.update({ keyB: keys.publicKeyJwk });
    return { privateKeyJwk: keys.privateKeyJwk };
  }
  const s = readLocal();
  const data = s.rooms[roomId];
  if (!data) return { error:'not_found' };
  if (data.keyB) return { error:'full' };
  data.keyB = keys.publicKeyJwk;
  writeLocal(s);
  return { privateKeyJwk: keys.privateKeyJwk };
}
function subscribeRoom(roomId, cb){
  if (db){
    return db.doc('rooms/'+roomId).onSnapshot(snap => cb(snap.exists ? snap.data() : null), err => console.error('room subscribe error', err));
  }
  const poll = () => { const s = readLocal(); cb(s.rooms[roomId] || null); };
  poll();
  const id = setInterval(poll, 1200);
  return () => clearInterval(id);
}
async function sendMessage(roomId, from, fields){
  const id = 'm_' + Math.random().toString(36).slice(2) + Date.now().toString(36).slice(-4);
  const msg = { id, roomId, from, createdAt: Date.now(), ...fields };
  if (JSON.stringify(msg).length > 230000) throw new Error('too_large');
  if (db){ await db.doc('messages/'+id).set(msg); return id; }
  const s = readLocal();
  s.messages.push(msg);
  writeLocal(s);
  return id;
}
function subscribeMessages(roomId, cb){
  if (db){
    return db.collection('messages').where('roomId','==',roomId).orderBy('createdAt','asc').limit(500)
      .onSnapshot(snap => cb(snap.docs.map(d => ({ id:d.id, ...d.data() }))), err => console.error('messages subscribe error', err));
  }
  const poll = () => { const s = readLocal(); cb(s.messages.filter(m => m.roomId === roomId).sort((a,b)=>a.createdAt-b.createdAt)); };
  poll();
  const id = setInterval(poll, 1000);
  return () => clearInterval(id);
}
async function deleteMessage(id){
  if (db){ await db.doc('messages/'+id).delete(); return; }
  const s = readLocal();
  s.messages = s.messages.filter(m => m.id !== id);
  writeLocal(s);
}
async function updateRoom(roomId, fields){
  if (db){ await db.doc('rooms/'+roomId).update(fields); return; }
  const s = readLocal();
  if (s.rooms[roomId]) Object.assign(s.rooms[roomId], fields);
  writeLocal(s);
}
async function wipeMessagesOnly(roomId){
  if (db){
    const snap = await db.collection('messages').where('roomId','==',roomId).limit(1000).get();
    await Promise.all(snap.docs.map(d => db.doc('messages/'+d.id).delete()));
    return;
  }
  const s = readLocal();
  s.messages = s.messages.filter(m => m.roomId !== roomId);
  writeLocal(s);
}
async function deleteConversation(roomId){
  if (db){
    const snap = await db.collection('messages').where('roomId','==',roomId).limit(1000).get();
    await Promise.all(snap.docs.map(d => db.doc('messages/'+d.id).delete()));
    await db.doc('rooms/'+roomId).delete();
    return;
  }
  const s = readLocal();
  s.messages = s.messages.filter(m => m.roomId !== roomId);
  delete s.rooms[roomId];
  writeLocal(s);
}

/* ============ local pairing list (per-device — never synced) ============ */
const PAIRS_KEY = 'sealbox_pairs_v2';
function loadPairs(){ try{ return JSON.parse(localStorage.getItem(PAIRS_KEY)) || []; } catch(e){ return []; } }
function savePairs(list){ localStorage.setItem(PAIRS_KEY, JSON.stringify(list)); }
function upsertPair(entry){
  const list = loadPairs();
  const i = list.findIndex(p => p.roomId === entry.roomId);
  if (i >= 0) list[i] = { ...list[i], ...entry }; else list.push(entry);
  savePairs(list);
}
function removePair(roomId){ savePairs(loadPairs().filter(p => p.roomId !== roomId)); }
function getPair(roomId){ return loadPairs().find(p => p.roomId === roomId) || null; }

/* ============ helpers ============ */
function shareUrl(roomId, commitment){
  const u = new URL(location.href); u.search = '?room=' + encodeURIComponent(roomId);
  if (commitment) u.hash = 'k=' + commitment;
  return u.toString();
}
// A hash of the creator's public key, carried in the URL fragment — fragments
// never get sent to a server, so this travels only through whatever channel you
// share the link over (text, email, in person), never through the relay itself.
// The joiner recomputes the same hash from the key the relay actually handed
// them and compares. If a relay swapped the key mid-pairing, this catches it
// before any message is ever sent — the safety number only catches it after.
async function sha256HexPrefix(jwk, len){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(jwk.x+':'+jwk.y));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('').slice(0, len||16);
}
function timeAgo(ts){
  const s = Math.floor((Date.now()-ts)/1000);
  if (s < 60) return 'just now';
  const m = Math.floor(s/60); if (m < 60) return m + (m===1?' min ago':' mins ago');
  const h = Math.floor(m/60); if (h < 24) return h + (h===1?' hour ago':' hours ago');
  const d = Math.floor(h/24); return d + (d===1?' day ago':' days ago');
}
function fmtDuration(sec){ sec = Math.round(sec||0); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function showToast(text){

}
function escapeHtml(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function cssEscape(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g, c => '\\'+c); }

/* ============ photo capture + compression ============ */
function readFileAsDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file); }); }
function loadImage(src){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=src; }); }
async function compressImage(file, maxDim, quality){
  const img = await loadImage(await readFileAsDataURL(file));
  let w = img.width, h = img.height;
  if (w > h && w > maxDim){ h = Math.round(h * maxDim / w); w = maxDim; }
  else if (h >= w && h > maxDim){ w = Math.round(w * maxDim / h); h = maxDim; }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(img, 0, 0, w, h);
  return new Promise(res => canvas.toBlob(res, 'image/jpeg', quality));
}
async function compressImageForSending(file){
  for (const [maxDim, quality] of [[900,0.72],[640,0.6],[480,0.5],[360,0.4]]){
    const blob = await compressImage(file, maxDim, quality);
    if (blob.size < 165000) return blob;
  }
  throw new Error('too_large');
}

/* ============ voice recording + optional on-device transcription ============ */
function createVoiceRecorder(){
  let mediaRecorder, chunks, stream, startedAt, recognizer, transcript = '';
  return {
    async start(){
      stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      chunks = [];
      const mimeType = (window.MediaRecorder && MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) ? 'audio/webm;codecs=opus' : 'audio/webm';
      mediaRecorder = new MediaRecorder(stream, { mimeType });
      mediaRecorder.ondataavailable = e => { if (e.data && e.data.size > 0) chunks.push(e.data); };
      startedAt = Date.now();
      mediaRecorder.start();
      transcript = '';
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (SR && captionsEnabled()){
        try{
          recognizer = new SR();
          recognizer.continuous = true;
          recognizer.interimResults = false;
          recognizer.lang = (navigator.language || 'en-US');
          recognizer.onresult = (e) => {
            for (let i = e.resultIndex; i < e.results.length; i++){
              if (e.results[i].isFinal) transcript += (transcript ? ' ' : '') + e.results[i][0].transcript.trim();
            }
          };
          recognizer.onerror = () => {};
          recognizer.start();
        } catch(e){ recognizer = null; }
      }
    },
    stop(){
      return new Promise(resolve => {
        mediaRecorder.onstop = () => {
          stream.getTracks().forEach(t => t.stop());
          if (recognizer){ try{ recognizer.stop(); } catch(e){} }
          resolve({ blob: new Blob(chunks, { type: mediaRecorder.mimeType }), duration: (Date.now() - startedAt) / 1000, transcript: transcript.trim() || null, mimeType: mediaRecorder.mimeType });
        };
        mediaRecorder.stop();
      });
    },
    cancel(){
      try{ mediaRecorder.onstop = null; mediaRecorder.stop(); } catch(e){}
      try{ stream.getTracks().forEach(t => t.stop()); } catch(e){}
      if (recognizer){ try{ recognizer.stop(); } catch(e){} }
    }
  };
}

function renderAppLockEntry(lock){
  const remaining = Math.max(0, lock.threshold - getLockAttempts());
  app.innerHTML = `
    <div class="hero">
      ${sealSvg('seal seal-hero')}
      <h2>Enter passcode</h2>
      <p>${remaining <= 1
        ? `<span style="color:var(--danger);">${remaining} attempt${remaining===1?'':'s'} left — after that, this device wipes itself, permanently.</span>`
        : `${remaining} attempts left before this device wipes itself.`}</p>

  const doUnlock = async () => {
    const val = document.getElementById('unlockInput').value;
    if (!val) return;
    const btn = document.getElementById('unlockAppBtn');
    btn.disabled = true; btn.textContent = 'Checking…';
    const salt = new Uint8Array(b64ToBuf(lock.saltB64));
    const hash = await pbkdf2VerifierHash(val, salt);
    if (hash === lock.hash){
      setLockAttempts(0);
      render();
    } else {
      const attempts = getLockAttempts() + 1;
      setLockAttempts(attempts);
      if (attempts >= lock.threshold){ await selfDestructDevice(); return; }
      showToast('Wrong passcode');
      renderAppLockEntry(lock);
    }
  };

    } catch(e){
      btn.disabled = false; btn.textContent = 'Unlock';
      showToast('Wrong passphrase');
    }
  };
  document.getElementById('unlockBtn').addEventListener('click', doUnlock);
  document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') doUnlock(); });
}

/* ---------- decoy chat: local-only, never touches the real room/keys/messages ---------- */
function decoyStorageKey(roomId){ return 'sealbox_decoy_'+roomId; }
function loadDecoyLog(roomId){ try{ return JSON.parse(localStorage.getItem(decoyStorageKey(roomId))) || []; } catch(e){ return []; } }
function saveDecoyLog(roomId, log){ localStorage.setItem(decoyStorageKey(roomId), JSON.stringify(log)); }
function renderDecoyChat(roomId, pairEntry){
  const log = loadDecoyLog(roomId);
  app.innerHTML = `
    <div class="topbar">
      <div class="brand" id="decoyBrand">${sealSvg('seal')} <span class="brand-name">${escapeHtml(pairEntry.label || 'Sealed pairing')}</span></div>
      <button class="icon-btn" id="decoyDeleteBtn" title="Delete conversation">&#128465;</button>
    </div>
    <div class="status-row"><span class="dot paired"></span>Paired &middot; anonymous &middot; forward-secret encryption</div>
    <div class="thread" id="decoyThread"></div>
    <div class="composer">
      <textarea id="decoyInput" rows="1" maxlength="2000" placeholder="Say something…"></textarea>
      <button class="send-btn" id="decoySendBtn" disabled>&#10148;</button>
    </div>
  `;
  attachPanicHold(document.getElementById('decoyBrand'), () => {
    saveDecoyLog(roomId, []);
    showToast('Cleared');
    navigateHome();
  });
  const threadEl = document.getElementById('decoyThread');
  function renderLog(){
    const l = loadDecoyLog(roomId);
    threadEl.innerHTML = l.length ? l.map(m => `<div class="bubble-row ${m.from==='me'?'me':'them'}"><div><div class="bubble">${escapeHtml(m.text)}</div><div class="bubble-time">${timeAgo(m.ts)}</div></div></div>`).join('')
      : `<div class="empty">${sealSvg('seal')}<p>No messages yet.</p></div>`;
    threadEl.scrollTop = threadEl.scrollHeight;
  }
  renderLog();
  const input = document.getElementById('decoyInput');
  const sendBtn = document.getElementById('decoySendBtn');
  input.addEventListener('input', () => { sendBtn.disabled = input.value.trim().length===0; });
  sendBtn.addEventListener('click', () => {
    const text = input.value.trim();
    if (!text) return;
    const l = loadDecoyLog(roomId);
    l.push({ from:'me', text, ts: Date.now() });
    saveDecoyLog(roomId, l);
    input.value=''; sendBtn.disabled = true;
    renderLog();
  });
  document.getElementById('decoyDeleteBtn').addEventListener('click', () => {
    confirmSheet({
      title:'Delete this conversation?',
      body:'This permanently erases these messages for both of you, right now.',
      confirmLabel:'Delete permanently',
      onConfirm: () => { saveDecoyLog(roomId, []); showToast('Conversation deleted'); navigateHome(); }
    });
  });
}
function attachPanicHold(el, onTrigger){
  if (!el) return;
  let timer = null;
  const start = () => { timer = setTimeout(() => { timer = null; onTrigger(); }, 650); };
  const cancel = () => { if (timer){ clearTimeout(timer); timer = null; } };
  el.addEventListener('pointerdown', start);
  el.addEventListener('pointerup', cancel);
  el.addEventListener('pointerleave', cancel);
  el.addEventListener('pointercancel', cancel);
}

/* ---------- chat ---------- */
async function renderChat(roomId, pair){
  app.innerHTML = `
    <div class="topbar">
      <div class="brand" id="chatBrand">${sealSvg('seal')} <span class="brand-name">${escapeHtml(pair.label || 'Sealed pairing')}</span></div>
      <div style="display:flex; gap:8px;">
        <button class="icon-btn" id="closeBtn" title="Close">&#8592;</button>
        <button class="icon-btn" id="privacyBtn" title="Privacy">&#128274;</button>
        <button class="icon-btn" id="renameBtn" title="Rename">&#9998;</button>
        <button class="icon-btn" id="deleteBtn" title="Delete conversation">&#128465;</button>
      </div>
    </div>
    <div id="chatBody"><div class="skeleton" style="margin-bottom:10px;"></div><div class="skeleton" style="width:60%;"></div></div>
  `;
  attachPanicHold(document.getElementById('chatBrand'), async () => {
    clearRatchetState(roomId);
    removePair(roomId);
    deleteConversation(roomId).catch(()=>{});
    showToast('Cleared');
    navigateHome();
  });
  document.getElementById('closeBtn').addEventListener('click', navigateHome);
  document.getElementById('privacyBtn').addEventListener('click', () => privacySettingsSheet(roomId, pair));
  document.getElementById('renameBtn').addEventListener('click', () => {
    const name = prompt('Label this pairing (only visible to you):', pair.label || '');
    if (name !== null){ upsertPair({ roomId, label: name.trim().slice(0,40) }); render(); }
  });
  document.getElementById('deleteBtn').addEventListener('click', () => {
    confirmSheet({
      title: 'Delete this conversation?',
      body: 'This permanently erases every message — text, photos, voice notes — for both of you, right now. Neither of you will be able to get them back.',
      confirmLabel: 'Delete permanently',
      onConfirm: async () => {
        try{
          await deleteConversation(roomId);
          clearRatchetState(roomId);
          removePair(roomId);
          showToast('Conversation deleted');
          navigateHome();
        } catch(e){ console.error(e); showToast('Could not delete — try again'); }
      }
    });
  });

  const body = document.getElementById('chatBody');
  let ratchetState = null;
  let wipeOnClose = false;
  const wipeIfEnabled = () => { if (wipeOnClose){ wipeMessagesOnly(roomId).catch(()=>{}); clearRatchetCache(roomId); } };
  const pageHideHandler = () => wipeIfEnabled();
  window.addEventListener('pagehide', pageHideHandler);
  activeUnsubs.push(() => { window.removeEventListener('pagehide', pageHideHandler); wipeIfEnabled(); });

  const roomUnsub = subscribeRoom(roomId, async (room) => {
    if (!room){
      clearSubs();
      body.innerHTML = `<div class="empty">${sealSvg('seal')}<p>This conversation was deleted.</p></div>`;
      clearRatchetState(roomId);
      removePair(roomId);
      setTimeout(() => { if (currentRoomParam() === roomId) navigateHome(); }, 1400);
      return;
    }
    wipeOnClose = !!room.wipeOnClose;
    const paired = !!(room.keyA && room.keyB);
    if (!paired){
      const hoursLeft = room.expiresAt ? Math.max(0, Math.round((room.expiresAt - Date.now())/3600000)) : null;
      const commitment = await sha256HexPrefix(room.keyA);
      body.innerHTML = `
        <div class="waiting-state">${sealSvg('seal seal-hero seal-pulse')}<h2>Waiting for them</h2>${anonBadge()}<p>Send this link to the one person you want on the other end. No name needed on either side — your chat unlocks the moment they open it.</p></div>
        <div class="card share-card"><div class="label">Your sealed link</div><div class="share-row"><span class="url mono">${escapeHtml(shareUrl(roomId, commitment))}</span><button class="copy-btn" id="copyBtn">Copy</button></div>
          <button class="secondary" id="showLinkQrBtn" style="margin-top:10px;">Show as QR</button>
          <div id="linkQrBox" class="qr-box" style="display:none;"></div>
        </div>
        ${hoursLeft !== null ? `<p class="expiry-note">This link expires in about ${hoursLeft} hour${hoursLeft===1?'':'s'} if unopened.</p>` : ''}
      `;
      const copyBtn = document.getElementById('copyBtn');
      if (copyBtn) copyBtn.addEventListener('click', async () => {
        try{ await navigator.clipboard.writeText(shareUrl(roomId, commitment)); showToast('Link copied'); }
        catch(e){ showToast('Copy failed — long-press to select'); }
      });
      const linkQrBtn = document.getElementById('showLinkQrBtn');
      if (linkQrBtn) linkQrBtn.addEventListener('click', () => {
        const box = document.getElementById('linkQrBox');
        const showing = box.style.display !== 'none';
        box.style.display = showing ? 'none' : 'flex';
        if (!showing && !box.dataset.rendered && typeof QRCode !== 'undefined'){
          new QRCode(box, { text: shareUrl(roomId, commitment), width:180, height:180 });
          box.dataset.rendered = '1';
        }
      });
      return;
    }

    if (!ratchetState){
      ratchetState = await getOrInitRatchet(roomId, pair, room);
      body.innerHTML = `
        <div class="status-row"><span class="dot paired"></span>Paired &middot; anonymous &middot; forward-secret encryption</div>
        <div class="thread" id="thread"></div>
        <div class="composer" id="composerRow">
          <button class="round-btn" id="burnBtn" title="Burn after reading">&#128293;</button>
          <button class="round-btn" id="attachBtn" title="Send a photo">&#128247;</button>
          <button class="round-btn" id="micBtn" title="Send a voice note">&#127908;</button>
          <textarea id="msgInput" rows="1" maxlength="2000" placeholder="Say something…"></textarea>
          <button class="send-btn" id="sendBtn" disabled>&#10148;</button>
        </div>
        <input type="file" id="photoInput" accept="image/*">
      `;
      const input = document.getElementById('msgInput');
      const sendBtn = document.getElementById('sendBtn');
      const composerRow = document.getElementById('composerRow');
      const attachBtn = document.getElementById('attachBtn');
      const micBtn = document.getElementById('micBtn');
      const photoInput = document.getElementById('photoInput');
      const burnBtn = document.getElementById('burnBtn');
      let burnArmed = false;
      burnBtn.addEventListener('click', () => {
        burnArmed = !burnArmed;
        burnBtn.classList.toggle('burn-armed', burnArmed);
        burnBtn.title = burnArmed ? 'Next message burns after they read it' : 'Burn after reading';
      });
      function takeBurnFlag(){ const b = burnArmed; burnArmed = false; burnBtn.classList.remove('burn-armed'); return b; }

      function showUploading(label){
        hideUploading();
        const row = document.createElement('div');
        row.className = 'uploading-row'; row.id = 'uploadingRow';
        row.innerHTML = `<div class="skeleton" style="width:16px; height:16px; border-radius:50%;"></div>${label}`;
        composerRow.parentElement.insertBefore(row, composerRow.nextSibling);
      }
      function hideUploading(){ const r = document.getElementById('uploadingRow'); if (r) r.remove(); }

      input.addEventListener('input', () => {
        sendBtn.disabled = input.value.trim().length === 0;
        input.style.height = 'auto';
        input.style.height = Math.min(input.scrollHeight, 110) + 'px';
      });
      input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); if (!sendBtn.disabled) sendBtn.click(); } });
      sendBtn.addEventListener('click', async () => {
        const text = input.value.trim();
        if (!text) return;
        const burn = takeBurnFlag();
        input.value = ''; input.style.height='auto'; sendBtn.disabled = true;
        try{
          const { aesKey, seq } = await takeSendStep(roomId, ratchetState);
          const envelope = encodeEnvelope({ type:'text' }, new TextEncoder().encode(text));
          const enc = await encryptBytes(aesKey, padPlaintext(envelope));
          const fields = { seq, ciphertext: enc.ciphertext, iv: enc.iv };
          if (burn) fields.burn = true;
          const now = Date.now();
          const room2 = await getRoom(roomId);
          if (room2 && room2.ttlSeconds) fields.expiresAt = now + room2.ttlSeconds*1000;
          const id = await sendMessage(roomId, ratchetState.myTag, fields);
          ratchetState.cache[id] = { type:'text', text };
          saveRatchetState(roomId, ratchetState);
        } catch(e){
          console.error(e);
          showToast(e.message === 'too_large' ? 'Message too long' : 'Message failed to send');
        }
      });

      attachBtn.addEventListener('click', () => photoInput.click());
      photoInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        photoInput.value = '';
        if (!file) return;
        if (!file.type.startsWith('image/')){ showToast("That file isn't a photo"); return; }
        const burn = takeBurnFlag();
        showUploading('Sealing photo…');
        try{
          const blob = await compressImageForSending(file);
          const buf = await blob.arrayBuffer();
          const { aesKey, seq } = await takeSendStep(roomId, ratchetState);
          const envelope = encodeEnvelope({ type:'image', mime:'image/jpeg' }, new Uint8Array(buf));
          const enc = await encryptBytes(aesKey, padPlaintext(envelope));
          const fields = { seq, ciphertext: enc.ciphertext, iv: enc.iv };
          if (burn) fields.burn = true;
          const room2 = await getRoom(roomId);
          if (room2 && room2.ttlSeconds) fields.expiresAt = Date.now() + room2.ttlSeconds*1000;
          const id = await sendMessage(roomId, ratchetState.myTag, fields);
          ratchetState.cache[id] = { type:'image', mime:'image/jpeg', dataB64: bufToB64(buf) };
          saveRatchetState(roomId, ratchetState);
        } catch(err){
          console.error(err);
          showToast(err.message === 'too_large' ? "That photo is too large to seal — try another" : 'Could not send that photo');
        } finally{ hideUploading(); }
      });

      micBtn.addEventListener('click', async () => {
        if (!navigator.mediaDevices || !window.MediaRecorder){ showToast("Voice notes aren't supported on this browser"); return; }
        let recorder;
        try{ recorder = createVoiceRecorder(); await recorder.start(); }
        catch(e){ showToast('Microphone access was denied'); return; }

        composerRow.style.display = 'none';
        const recRow = document.createElement('div');
        recRow.className = 'recording-row';
        recRow.innerHTML = `<span class="rec-dot"></span><span class="rec-time" id="recTime">0:00</span><button class="rec-cancel" id="recCancel">Cancel</button><button class="rec-stop" id="recStop">Send</button>`;
        composerRow.parentElement.insertBefore(recRow, composerRow);
        const startedAt = Date.now();
        const timeEl = document.getElementById('recTime');
        const timerId = setInterval(() => {
          const elapsed = (Date.now() - startedAt) / 1000;
          timeEl.textContent = fmtDuration(elapsed);
          if (elapsed >= MAX_RECORD_SECONDS) document.getElementById('recStop').click();
        }, 200);

        document.getElementById('recCancel').addEventListener('click', () => {
          clearInterval(timerId);
          recorder.cancel();
          recRow.remove();
          composerRow.style.display = '';
        });
        document.getElementById('recStop').addEventListener('click', async () => {
          clearInterval(timerId);
          recRow.remove();
          composerRow.style.display = '';
          showUploading('Sealing voice note…');
          const burn = takeBurnFlag();
          try{
            const { blob, duration, transcript } = await recorder.stop();
            if (duration < 0.6){ showToast('Recording was too short'); return; }
            const buf = await blob.arrayBuffer();
            const { aesKey, seq } = await takeSendStep(roomId, ratchetState);
            const mime = blob.type || 'audio/webm';
            const envelope = encodeEnvelope({ type:'audio', mime, duration, transcript: transcript || null }, new Uint8Array(buf));
            const enc = await encryptBytes(aesKey, padPlaintext(envelope));
            const fields = { seq, ciphertext:enc.ciphertext, iv:enc.iv };
            if (burn) fields.burn = true;
            const room2 = await getRoom(roomId);
            if (room2 && room2.ttlSeconds) fields.expiresAt = Date.now() + room2.ttlSeconds*1000;
            const id = await sendMessage(roomId, ratchetState.myTag, fields);
            ratchetState.cache[id] = { type:'audio', mime, duration, dataB64: bufToB64(buf), transcript };
            saveRatchetState(roomId, ratchetState);
          } catch(err){
            console.error(err);
            showToast(err.message === 'too_large' ? 'That voice note is too long to seal' : 'Could not send that voice note');
          } finally{ hideUploading(); }
        });
      });

      const threadEl = document.getElementById('thread');
      const msgsUnsub = subscribeMessages(roomId, async (messages) => {
        const now = Date.now();
        const expired = messages.filter(m => m.expiresAt && m.expiresAt < now);
        if (expired.length) expired.forEach(m => deleteMessage(m.id).catch(()=>{}));
        const live = messages.filter(m => !(m.expiresAt && m.expiresAt < now));
        const atBottom = threadEl.scrollTop + threadEl.clientHeight >= threadEl.scrollHeight - 30;
        if (!live.length){
          threadEl.innerHTML = `<div class="empty">${sealSvg('seal')}<p>No messages yet. Whatever you send here — text, photos, voice — only the two of you will ever be able to unseal.</p></div>`;
          return;
        }
        await processIncomingForCache(roomId, pair, ratchetState, live);
        threadEl.innerHTML = live.map(m => `
          <div class="bubble-row ${m.from === ratchetState.myTag ? 'me' : 'them'}" data-id="${escapeHtml(m.id||'')}">
            <div><div class="bubble"></div><div class="bubble-time">${timeAgo(m.createdAt)}${m.burn ? ' &middot; burns after reading' : ''}</div></div>
          </div>`).join('');
        for (const m of live){
          const bubbleEl = threadEl.querySelector(`.bubble-row[data-id="${cssEscape(m.id||'')}"] .bubble`);
          if (!bubbleEl) continue;
          renderBubbleFromCache(bubbleEl, ratchetState.cache[m.id], m.burn);
        }
        if (atBottom) threadEl.scrollTop = threadEl.scrollHeight;
      });
      activeUnsubs.push(msgsUnsub);
    }

    // Runs on every room update, not just the first. If the peer's identity
    // key ever stops matching what this ratchet was built from — whether from
    // their own deliberate startFreshKeys, or something less deliberate — the
    // local chains are now derived from the wrong root and will silently fail
    // to decrypt anything new. Surface that instead of letting it fail quietly.
    if (ratchetState){
      const currentPeerKeyId = pubKeyId(pair.role === 'A' ? room.keyB : room.keyA);
      if (ratchetState.peerIdentityKeyId && currentPeerKeyId && ratchetState.peerIdentityKeyId !== currentPeerKeyId && !document.getElementById('keyChangeBanner')){
        const banner = document.createElement('div');
        banner.id = 'keyChangeBanner';
        banner.className = 'card';
        banner.style.cssText = 'border-color:var(--danger); margin-bottom:12px; padding:12px 14px;';
        banner.innerHTML = `<div style="font-size:13px; color:var(--danger); margin-bottom:8px;">&#9888; Their key changed. Could be them starting fresh on purpose, or it could be something worth checking. Reload, then compare the safety number before trusting new messages.</div><button class="secondary" id="reloadAfterKeyChange" style="width:auto; padding:8px 14px; font-size:13px;">Reload conversation</button>`;
        const threadEl = document.getElementById('thread');
        if (threadEl && threadEl.parentElement) threadEl.parentElement.insertBefore(banner, threadEl);
        const reloadBtn = document.getElementById('reloadAfterKeyChange');
        if (reloadBtn) reloadBtn.addEventListener('click', () => { clearRatchetState(roomId); render(); });
      }
    }
  });
  activeUnsubs.push(roomUnsub);
}

function renderBubbleFromCache(bubbleEl, cached, burn){
  const flame = burn ? '<span class="flame-badge">&#128293;</span>' : '';
  if (!cached){ bubbleEl.innerHTML = flame + 'Unsealing…'; bubbleEl.classList.add('pending'); return; }
  bubbleEl.classList.remove('pending');
  if (cached.type === 'error'){ bubbleEl.innerHTML = flame + escapeHtml(cached.text); return; }
  if (cached.type === 'image'){
    const url = URL.createObjectURL(b64ToBlob(cached.dataB64, cached.mime));
    bubbleEl.classList.add('bubble-image');
    bubbleEl.innerHTML = `<img class="msg-img" src="${url}">`;
    bubbleEl.querySelector('img').addEventListener('click', () => openLightbox(url));
  } else if (cached.type === 'audio'){
    const url = URL.createObjectURL(b64ToBlob(cached.dataB64, cached.mime));
    bubbleEl.classList.add('bubble-audio');
    bubbleEl.innerHTML = `${flame}<div class="audio-row"><audio controls src="${url}"></audio><span class="dur">${fmtDuration(cached.duration)}</span></div>${cached.transcript ? `<div class="transcript">"${escapeHtml(cached.transcript)}"</div>` : ''}`;
  } else {
    bubbleEl.innerHTML = flame + escapeHtml(cached.text);
  }
}

  const lock = loadAppLock();
